<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f1b4d">
<title>Log in · Payment Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/customer.css?v=3">
<meta name="robots" content="noindex"><link rel="stylesheet" href="proto.css"></head>
<body>
<div class="shell">
  <div class="topline"><div class="brand"><i aria-hidden="true">₹</i>Payment Check</div></div>
  <section class="card">
    <form method="post" action="/wallet/login" class="block" style="margin:0">
      <h1 class="sec-title" style="font-size:20px">Log in to your wallet</h1>
      <p class="sec-sub" style="margin:0">Demo login: no OTP. Use any name and a 10-digit mobile number.</p>
      
      <label class="f">Name<input id="name" name="name" autocomplete="name" required value=""></label>
      <label class="f">Mobile number<input id="phone" name="phone" inputmode="numeric" autocomplete="tel" required placeholder="98765 43210" value=""></label>
      <button type="submit" class="btn brand">Log in</button>
    </form>
  </section>
</div>
<script>window.PROTO={"page": "login.html", "wallet": "wallet.html"}</script><script src="proto.js"></script></body>
</html>
